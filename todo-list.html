<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✅ 待辦清單 To-Do List</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --done: #10b981; --border: #334155;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text);
    padding: 20px; max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 1.5rem; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
  }
  .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1; background: #273449; border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 12px 14px;
    font-size: 1rem; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #0f172a; border: none;
    border-radius: 10px; padding: 12px 18px; font-size: 1rem;
    font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: 0.85; }
  ul { list-style: none; }
  li {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 6px; border-bottom: 1px solid var(--border);
    font-size: 1rem;
  }
  li:last-child { border-bottom: none; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--done); cursor: pointer; }
  .del {
    margin-left: auto; background: none; border: none; color: #ef4444;
    font-size: 1.1rem; cursor: pointer; padding: 4px 8px;
  }
  .count { color: var(--muted); font-size: 0.8rem; margin-top: 14px; text-align: center; }
</style>
</head>
<body>
  <h1>✅ 待辦清單</h1>
  <div class="sub">簡單 To-Do List · 資料儲存喺你手機瀏覽器</div>
  <div class="card">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="輸入新任務..." />
      <button onclick="addTask()">加入</button>
    </div>
    <ul id="taskList"></ul>
    <div class="count" id="count">0 項任務</div>
  </div>

<script>
  const list = document.getElementById("taskList");
  const input = document.getElementById("taskInput");
  const count = document.getElementById("count");
  let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

  function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); render(); }

  function render() {
    list.innerHTML = "";
    tasks.forEach((t, i) => {
      const li = document.createElement("li");
      li.className = t.done ? "done" : "";
      li.innerHTML = `
        <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggle(${i})" />
        <span>${t.text}</span>
        <button class="del" onclick="remove(${i})">✕</button>`;
      list.appendChild(li);
    });
    const remaining = tasks.filter(t => !t.done).length;
    count.textContent = `${tasks.length} 項任務，${remaining} 項未完成`;
  }

  function addTask() {
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    input.value = "";
    save();
  }

  function toggle(i) { tasks[i].done = !tasks[i].done; save(); }
  function remove(i) { tasks.splice(i, 1); save(); }

  input.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
  render();
</script>
</body>
</html>
